<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fcbe8">
<meta name="description" content="宝石を集めて発展カードを買い、先に15点を目指す2人用ボードゲーム">
<!-- ホーム画面に追加したときの設定（PWA） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splender">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Splender ～小鳥～</title>
<!-- app:css（ビルドのときに、まとめたCSSに置き換わる） -->
</head>
<body>

<!-- 開始画面（中身は src/view/screens.ts で作る） -->
<div id="startScreen" class="overlay"></div>

<!-- メニュー -->
<div id="menuScreen" class="overlay" data-act="backdrop" hidden>
  <div class="modal-box">
    <h1>メニュー</h1>
    <div class="menu-list">
      <button class="btn primary" data-act="rules">ルール説明</button>
      <button class="btn" data-act="log">対戦ログを見る</button>
      <button class="btn" data-act="toStart">開始画面へ（強さを選び直す）</button>
      <button class="btn" data-act="closeMenu">ゲームに戻る</button>
    </div>
    <div class="save-status" id="saveStatus"></div>
    <details id="dataCheck">
      <summary id="dataCheckSummary">カードデータ確認</summary>
      <div id="dataCheckBody"></div>
    </details>
  </div>
</div>

<!-- ルール説明（中身は src/view/screens.ts で作る） -->
<div id="rulesScreen" class="overlay" data-act="backdrop" hidden>
  <div class="modal-box" id="rulesBody"></div>
</div>

<!-- 対戦ログ（1画面に収めるため、メニューから開く） -->
<div id="logScreen" class="overlay" data-act="backdrop" hidden>
  <div class="modal-box">
    <div class="rules-head"><h2>対戦ログ（新しい順）</h2><button class="btn" data-act="closeLog">閉じる ✕</button></div>
    <ol id="log" reversed></ol>
  </div>
</div>

<!-- 勝敗の画面（中身は src/view/result.ts で作る） -->
<div id="resultScreen" class="overlay" hidden></div>

<!-- 買ったカードの一覧の吹き出し（src/view/tooltip.ts） -->
<div id="cardTip" role="tooltip" hidden></div>

<!-- チュートリアルの案内（src/app/tutorial.ts・src/view/coach.ts） -->
<div id="coach" hidden></div>

<!-- 演出を表示する層 -->
<div id="fxLayer" aria-hidden="true"></div>

<!-- ゲーム画面：スクロールしなくても全部が1画面に入るように並べる（並べ方は layout.css） -->
<div id="game">
  <header id="banner"></header>
  <section id="opp" class="seat"></section>
  <div id="nobles" aria-label="貴族タイル（各3点）"></div>
  <div id="bank" aria-label="宝石トークン"></div>
  <section id="cardRows" aria-label="発展カード"></section>
  <section id="me" class="seat"></section>
  <section id="controls">
    <div id="message" aria-live="polite"></div>
    <div id="recentBar" aria-live="polite" hidden></div>
    <div id="ctrlBody"></div>
  </section>
</div>

<noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
<!-- app:js（ビルドのときに、まとめたプログラムに置き換わる） -->
</body>
</html>
